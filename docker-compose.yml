name: wallet-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      # Consumed by docker/postgres/init/01-roles.sh
      DB_OWNER_USER: ${DB_OWNER_USER:-wallet_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend service is added in Phase 2, Step 14 (Dockerfile).

volumes:
  pgdata:
