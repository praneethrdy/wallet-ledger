name: wallet-ledger

# Default:        docker compose up -d                  -> Postgres only (run the app with ./mvnw spring-boot:run)
# Whole stack:    docker compose --profile app up -d    -> + backend container (prod profile, JSON logs)
# Observability:  docker compose --profile observability up -d  -> + Prometheus :9090, Grafana :3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      # Consumed by docker/postgres/init/01-roles.sh
      DB_OWNER_USER: ${DB_OWNER_USER:-wallet_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wallet}
      DB_OWNER_USER: ${DB_OWNER_USER:-wallet_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner_dev}
      DB_APP_USER: ${DB_APP_USER:-wallet_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-app_dev}
      # Local demo values only. Real deployments inject these from a secrets manager.
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMzJieXRlcyE=}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
    ports:
      - "8080:8080"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
