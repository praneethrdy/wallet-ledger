# Connection details come from Testcontainers via @DynamicPropertySource (AbstractIntegrationTest).
spring:
  datasource:
    hikari:
      # Each cached test context holds its own pool against the shared container: keep them small.
      maximum-pool-size: 10
      minimum-idle: 1

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO

security:
  auth:
    jwt-secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtbG9uZyE=

app:
  scheduling:
    enabled: false   # tests invoke jobs directly

idempotency:
  in-flight-wait: 2s   # keeps the "409 after waiting" test fast

webhook:
  payment-provider:
    secret: test-webhook-secret
    previous-secret: test-webhook-secret-old

payments:
  demo:
    enabled: true
