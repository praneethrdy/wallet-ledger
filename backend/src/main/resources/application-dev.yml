# Local development against `docker compose up -d`. Defaults match .env.example.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:wallet}
    username: ${DB_APP_USER:wallet_app}
    password: ${DB_APP_PASSWORD:app_dev}
  flyway:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:wallet}
    user: ${DB_OWNER_USER:wallet_owner}
    password: ${DB_OWNER_PASSWORD:owner_dev}

security:
  auth:
    # DEV ONLY. Generate a real one with:  openssl rand -base64 32
    jwt-secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMzJieXRlcyE=}

webhook:
  payment-provider:
    # DEV ONLY. scripts/sign-webhook.sh uses the same default.
    secret: ${WEBHOOK_SECRET:dev-webhook-secret-change-me}
    previous-secret: ${WEBHOOK_PREVIOUS_SECRET:}
