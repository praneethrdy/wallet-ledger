# Shared config for all profiles. Profile files (dev/test/prod) supply connection details.
spring:
  application:
    name: wallet-backend

  # The app connects as the least-privilege DML role (DB_APP_USER).
  datasource:
    hikari:
      maximum-pool-size: 20

  # Flyway connects separately as the schema owner (DB_OWNER_USER) to run DDL.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets migrations GRANT/REVOKE on the app role without hard-coding its name.
    placeholders:
      app_role: ${DB_APP_USER:wallet_app}

  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't hold a DB connection open for the whole HTTP request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    # Reject unknown JSON fields instead of silently ignoring typos like "ammount".
    deserialization:
      fail-on-unknown-properties: true

app:
  reporting-zone: Asia/Kolkata
  default-currency: INR
  scheduling:
    enabled: true
  http:
    max-request-bytes: 65536   # 64 KiB; every legitimate body is far smaller

idempotency:
  ttl: 24h
  stale-after: 60s
  in-flight-wait: 5s

webhook:
  payment-provider:
    provider: mockpay
    tolerance: 5m
    # secret / previous-secret are set per profile (prod: env WEBHOOK_SECRET / WEBHOOK_PREVIOUS_SECRET only)

security:
  auth:
    # jwt-secret is set per profile (dev default / test fixed / prod from env JWT_SECRET only).
    issuer: wallet-backend
    access-token-ttl: 15m
    refresh-token-ttl: 7d

server:
  # Boot's fallback /error page (used for errors outside MVC, e.g. in filters) must not leak internals.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # Every log line carries the request's correlation ID (set by CorrelationIdFilter).
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true          # /actuator/health/liveness and /readiness for orchestrators
  metrics:
    tags:
      application: wallet-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wallet.ledger.lock.wait: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
